[policy]
# 核心流量池：直连中间层 + 花云中转，中间层由「IP中转节点」手动切换
url-latency-benchmark=直连, resource-tag-regex=^(RackNerd|ccwu)$, server-tag-regex=.*, check-interval=900, tolerance=0, alive-checking=false, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png
url-latency-benchmark=中转, resource-tag-regex=花云, server-tag-regex=^(?=.*(?:香港|台湾|新加坡|日本|东京|大阪|港|台|狮城|HK|TW|SG|JP))(?=.*IEPL)(?=.*专线).*$, check-interval=900, tolerance=0, alive-checking=false, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png

